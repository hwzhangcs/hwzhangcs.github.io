<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-name" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Hanwen Zhang</a>
    <ul class="nav-links">
      {% for link in site.data.navigation.main %}
      <li><a href="{{ link.url | relative_url }}"{% unless link.url contains '#' %}{% if page.url contains link.url %} aria-current="page"{% endif %}{% endunless %}>{{ link.title }}</a></li>
      {% endfor %}
    </ul>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><i class="fas fa-moon" aria-hidden="true"></i></button>
  </nav>
</header>
