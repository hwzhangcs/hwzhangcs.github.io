<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-name" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Hanwen Zhang <span lang="zh">/ 张瀚文</span></a>
    <button class="menu-toggle" type="button" aria-controls="main-links" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button>
    <ul id="main-links" class="nav-links">
      {% for link in site.data.navigation.main %}
      <li><a href="{{ link.url | relative_url }}"{% if link.url contains '#' %} data-section="research-experience"{% elsif page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
      {% endfor %}
    </ul>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><i class="fas fa-moon" aria-hidden="true"></i></button>
  </nav>
</header>
