name: Build and validate site

on:
  push:
    branches: [main, publish-ready]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Validate generated site
        run: python3 scripts/check_site.py _site

      - name: Validate LaTeX CV source
        run: python3 scripts/check_cv_tex.py
