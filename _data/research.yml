- id: animal-reconstruction
  title: "Bone-to-Shape: Single-Image Animal Reconstruction"
  role: Project Lead
  institution: Sichuan University
  date: "Jan 2026 – Sep 20, 2026"
  program: Provincial Undergraduate Innovation Training Program
  applied: November 18 – December 9, 2025
  approved: January 19, 2026
  detail_url: /research/bone-to-shape/
  diagram: /assets/diagrams/bone-to-shape.svg
  question: How can generative view completion and animal shape priors make single-image 3D reconstruction more structurally plausible and view-consistent?
  bullets:
    - Led a project that combined AniMer-based animal pose and shape estimation with a ReconX-inspired sparse-view video diffusion stage and 3D Gaussian Splatting (3DGS) reconstruction.
    - Generated orbit-view video from a single animal image and studied how anatomical and body-shape priors constrain the reconstructed geometry.
  details:
    - "Project title: Bone-to-Shape: Anatomy-Constrained 3D Reconstruction for Veterinary Applications (骨影生形)."
    - "Project pipeline: use AniMer for an animal pose and shape prior, then draw on the sparse-view video diffusion and 3DGS reconstruction pattern of ReconX. The project treats generated views as model predictions rather than new observations."
    - Applied in the November 18 – December 9, 2025 round; approved in the 2026 project list announced January 19, 2026.
    - Passed the college midterm review and the final review; completed September 20, 2026. Related patent application details are listed under Intellectual Property.
  homepage:
    featured: true
    name: Bone-to-Shape
    zh: 骨影生形
    status: Completed project · Jan–Sep 2026
    deck: Animal reconstruction from a single image with shape priors and video diffusion
    summary: From one photograph of an animal, the project combines an AniMer-based animal shape prior with a ReconX-inspired video diffusion stage to generate orbit views and reconstruct a 3D Gaussian Splatting model. Generated views are treated as model predictions, not new observations.
    outcomes:
      - Passed the midterm and final reviews
      - Invention patent application filed, first-listed inventor

