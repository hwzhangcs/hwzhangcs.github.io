---
layout: default
---
<div id="main" class="academic-layout">
  {% include profile.html %}
  <main id="content" class="academic-content{% if page.url == '/cv/' %} cv-content{% endif %}">
    <header class="content-header">
      {% if page.back_url %}<a class="back-link" href="{{ page.back_url | relative_url }}">← {{ page.back_label }}</a>{% elsif page.collection == 'portfolio' %}<a class="back-link" href="{{ '/portfolio/' | relative_url }}">← Software Projects</a>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.updated %}<p class="entry-meta">Content updated {{ page.updated | date: '%B %-d, %Y' }}</p>{% endif %}
    </header>
    {{ content }}
  </main>
</div>
