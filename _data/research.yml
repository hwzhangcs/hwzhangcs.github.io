- id: animal-reconstruction
  title: "Bone-to-Shape: Single-Image Animal Reconstruction"
  role: Project Lead
  institution: Sichuan University
  date: "Jan 2026 – Present"
  program: Provincial Undergraduate Innovation Training Program
  applied: November 18 – December 9, 2025
  approved: January 19, 2026
  detail_url: /research/bone-to-shape/
  diagram: /assets/diagrams/bone-to-shape.svg
  question: How can generative view completion and animal shape priors make single-image 3D reconstruction more structurally plausible and view-consistent?
  bullets:
    - Lead a project that combines AniMer-based animal pose and shape estimation with a ReconX-inspired sparse-view video diffusion stage and 3D Gaussian Splatting (3DGS) reconstruction.
    - Generate orbit-view video from a single animal image and study how anatomical and body-shape priors constrain the reconstructed geometry.
  details:
    - "Project title: Bone-to-Shape: Anatomy-Constrained 3D Reconstruction for Veterinary Applications (骨影生形)."
    - "Current pipeline: use AniMer for an animal pose and shape prior, then draw on the sparse-view video diffusion and 3DGS reconstruction pattern of ReconX. The project treats generated views as predicted observations, providing a concrete starting point for future visual world modeling."
    - Applied in the November 18 – December 9, 2025 round; approved in the 2026 project list announced January 19, 2026.
    - Passed the college midterm review. Related patent application details are listed under Intellectual Property.
  homepage:
    featured: true
    name: Bone-to-Shape
    zh: 骨影生形
    since: Jan 2026
    deck: Animal reconstruction from a single image with shape priors and video diffusion
    summary: From one photograph of an animal, the project combines an AniMer-based animal shape prior with a ReconX-inspired video diffusion stage to generate orbit views and reconstruct a 3D Gaussian Splatting model.
    outcomes:
      - Passed the college midterm review
      - Invention patent application filed, first-listed inventor

