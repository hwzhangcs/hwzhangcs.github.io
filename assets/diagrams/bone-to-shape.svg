<title id="title">Single-image animal reconstruction workflow schematic</title>
<desc id="desc">An input image is used to generate multiple views, followed by a 3D Gaussian representation. A lower annotation identifies anatomy and body-shape priors as the research focus. This is a conceptual diagram, not a reconstruction result.</desc>
