# Site settings for hwzhangcs.github.io (Jekyll on GitHub Pages).
# This file is not reloaded by `jekyll serve`; restart the server after editing it.

locale      : "en-US"
title       : "Hanwen Zhang / 张瀚文"
name        : "Hanwen Zhang"
description : "Hanwen Zhang - Computer science honors undergraduate interested in multimodal reasoning about the physical world and when it can be trusted"
url         : "https://hwzhangcs.github.io"
baseurl     : ""
repository  : "hwzhangcs/hwzhangcs.github.io"
theme       : null # no GitHub Pages default theme; the site ships its own layouts and styles

# Contact details and profiles, used by the homepage, CV header, footer and structured data.
author:
  name         : "Hanwen Zhang"
  affiliation  : "Sichuan University"
  location     : "Chengdu, China"
  email        : "hanwen_zhang@stu.scu.edu.cn"
  github       : "hwzhangcs"
  googlescholar: "https://scholar.google.com/citations?user=o_uTmywAAAAJ"
  orcid        : "https://orcid.org/0009-0009-5637-1971"

# Link-preview image in /images/.
og_image: "portrait.jpg"

# Content
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: academic

include:
  - _pages

exclude:
  - .devcontainer
  - .sass-cache
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docs
  - latex
  - scripts
  - vendor
  - local

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
